<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Search Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07080c;
    --panel: rgba(255,255,255,0.035);
    --panel-hover: rgba(255,255,255,0.065);
    --line: rgba(255,255,255,0.08);
    --text: #eceef4;
    --muted: #8b92a8;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --sans: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --accent: #818cf8;
    --accent-2: #22d3ee;

    --c-found: #94a3b8;
    --c-drafting: #fbbf24;
    --c-applied: #818cf8;
    --c-interview: #22d3ee;
    --c-offer: #4ade80;
    --c-closed: #fb7185;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  .glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 500px at 8% -8%, rgba(129,140,248,0.17), transparent 60%),
      radial-gradient(800px 500px at 98% 0%, rgba(34,211,238,0.09), transparent 60%),
      radial-gradient(700px 500px at 50% 112%, rgba(74,222,128,0.06), transparent 60%);
    animation: drift 18s ease-in-out infinite alternate;
  }
  @keyframes drift { from { transform: translate3d(0,0,0) scale(1); } to { transform: translate3d(0,-18px,0) scale(1.04); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }

  .shell { position: relative; z-index: 1; width: 100%; min-height: 100vh; display: flex; flex-direction: column; gap: 14px; padding: 18px clamp(16px, 2.4vw, 40px) 28px; }

  /* top bar */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; animation: rise .7s both; }
  .brand { font-family: var(--serif); font-size: 26px; letter-spacing: -0.01em; }
  .brand em { color: var(--accent); }
  .brand span { font-family: var(--sans); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-left: 14px; }
  .month-nav { display: flex; align-items: center; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .month-nav button { background: transparent; border: 0; color: var(--text); width: 30px; height: 30px; border-radius: 50%; cursor: pointer; font-size: 17px; transition: background .25s, transform .25s; }
  .month-nav button:hover { background: var(--panel-hover); transform: scale(1.1); }
  .month-label { min-width: 138px; text-align: center; font-weight: 500; font-size: 13px; }

  /* command band */
  .band {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: clamp(18px, 3vw, 48px); align-items: center;
    padding: clamp(16px, 2vw, 26px) clamp(18px, 2.4vw, 34px);
    background: linear-gradient(135deg, rgba(255,255,255,0.055), rgba(255,255,255,0.015));
    border: 1px solid var(--line); border-radius: 22px; backdrop-filter: blur(14px);
    animation: rise .8s .06s both;
  }
  .count { display: flex; align-items: baseline; gap: 10px; line-height: .85; }
  .count .big { font-family: var(--serif); font-size: clamp(84px, 9vw, 140px); letter-spacing: -0.03em; }
  .count .of { font-family: var(--serif); font-size: clamp(34px, 3.4vw, 54px); color: var(--muted); }
  .count-label { margin-top: 10px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .pace { display: inline-flex; align-items: center; gap: 8px; margin-top: 12px; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; border: 1px solid; }
  .pace::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 10px currentColor; animation: pulse 2s ease-in-out infinite; }
  .pace.good { color: var(--c-offer); border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.08); }
  .pace.warn { color: var(--c-drafting); border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); }
  .pace.bad { color: var(--c-closed); border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }

  .segwrap { min-width: 0; }
  .segs { display: grid; gap: 7px; }
  .seg { height: clamp(34px, 4.2vw, 56px); border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid var(--line); position: relative; overflow: hidden; }
  .seg::after { content: ""; position: absolute; inset: 0; background: linear-gradient(135deg, var(--accent), var(--accent-2)); transform: scaleX(0); transform-origin: left; transition: transform .6s cubic-bezier(.2,.8,.2,1); transition-delay: var(--d, 0s); box-shadow: 0 0 22px rgba(129,140,248,.55); }
  .seg.on::after { transform: scaleX(1); }
  .segmeta { display: flex; justify-content: space-between; margin-top: 10px; font-size: 12px; color: var(--muted); letter-spacing: .06em; }

  .pipe { display: grid; grid-template-columns: repeat(3, auto); gap: 14px 30px; }
  .pstat { text-align: left; }
  .pstat .n { font-family: var(--serif); font-size: clamp(34px, 3.4vw, 50px); line-height: 1; color: var(--c); }
  .pstat .l { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .pstat .l::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }

  /* stage */
  .stage { flex: 1; display: flex; flex-direction: column; gap: 18px; }
  .sec-head { display: flex; align-items: center; gap: 14px; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
  .sec-head b { color: var(--text); font-weight: 600; }
  .sec-head::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .focus { flex: 1 1 auto; min-height: 380px; display: grid; grid-template-columns: minmax(360px, 5fr) 7fr; gap: 14px; align-items: stretch; }
  .focus.solo { grid-template-columns: 1fr; }

  .feature {
    position: relative; display: flex; flex-direction: column; text-decoration: none; color: inherit; overflow: hidden;
    padding: clamp(22px, 2.4vw, 36px); border-radius: 24px; border: 1px solid rgba(129,140,248,.35);
    background: radial-gradient(600px 300px at 0% 0%, rgba(129,140,248,.2), transparent 65%), linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
    box-shadow: 0 30px 80px -40px rgba(129,140,248,.6);
    animation: rise .8s .15s both; transition: transform .4s cubic-bezier(.2,.8,.2,1), box-shadow .4s;
  }
  .feature:hover { transform: translateY(-3px); box-shadow: 0 36px 90px -36px rgba(129,140,248,.8); }
  .eyebrow { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); animation: pulse 2s ease-in-out infinite; }
  .f-role { font-family: var(--serif); font-size: clamp(38px, 4.2vw, 70px); line-height: 1.02; letter-spacing: -0.015em; margin-top: 18px; }
  .f-company { font-size: 18px; color: var(--muted); margin-top: 10px; }
  .f-pay { font-family: var(--serif); font-size: clamp(38px, 4vw, 66px); margin-top: 20px; line-height: 1; background: linear-gradient(90deg, #fff, #c7d2fe 60%, #a5f3fc); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .f-note { margin-top: 20px; font-size: 17px; line-height: 1.6; color: #b9bfd0; max-width: 48ch; }
  .f-foot { padding-top: 22px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .cta { display: inline-flex; align-items: center; gap: 10px; padding: 14px 24px; border-radius: 999px; font-weight: 600; font-size: 15px; color: #0a0c14; background: linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow: 0 10px 30px -10px rgba(34,211,238,.6); transition: transform .3s, box-shadow .3s; }
  .feature:hover .cta { transform: translateX(4px); box-shadow: 0 14px 38px -8px rgba(34,211,238,.8); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.fit-High { color: var(--c-offer); border-color: rgba(74,222,128,.3); background: rgba(74,222,128,.08); }
  .tag.fit-Medium { color: var(--c-drafting); border-color: rgba(251,191,36,.3); background: rgba(251,191,36,.08); }
  .tag.fit-Low { color: var(--c-closed); border-color: rgba(251,113,133,.3); background: rgba(251,113,133,.08); }
  .tag.st { color: var(--c); border-color: color-mix(in srgb, var(--c) 35%, transparent); background: color-mix(in srgb, var(--c) 9%, transparent); }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: auto; padding-top: 26px; }
  .fact { padding: 18px 18px; border-radius: 16px; background: rgba(255,255,255,.04); border: 1px solid var(--line); }
  .fact .fl { font-size: 10px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .fact .fv { font-family: var(--serif); font-size: clamp(26px, 2.6vw, 40px); margin-top: 6px; line-height: 1; }
  .fact .fv.High { color: var(--c-offer); } .fact .fv.Medium { color: var(--c-drafting); } .fact .fv.Low { color: var(--c-closed); }
  .fact .fv.up { color: var(--c-offer); }

  .queue { display: grid; grid-auto-rows: minmax(88px, 122px); align-content: start; gap: 10px; }
  .row.dim { filter: saturate(.45) brightness(.8); }
  .focus.tall .feature { align-self: start; position: sticky; top: 16px; }
  .row {
    position: relative; display: grid; grid-template-columns: 34px minmax(0, 1fr) auto auto; gap: 8px 22px; align-items: center;
    padding: 14px 22px 14px 20px; border-radius: 18px; background: var(--panel); border: 1px solid var(--line);
    text-decoration: none; color: inherit; overflow: hidden; opacity: 0; animation: rise .7s cubic-bezier(.2,.8,.2,1) forwards;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), background .3s, border-color .3s, box-shadow .35s;
  }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c); box-shadow: 0 0 14px var(--c); }
  .row:hover { transform: translateX(5px); background: var(--panel-hover); border-color: color-mix(in srgb, var(--c) 45%, transparent); box-shadow: 0 14px 40px -16px color-mix(in srgb, var(--c) 45%, transparent); }
  .rank { font-family: var(--serif); font-size: 30px; color: rgba(255,255,255,.25); line-height: 1; }
  .r-role { font-weight: 600; font-size: 17px; line-height: 1.25; }
  .r-company { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .r-note { color: #7d849a; font-size: 12px; line-height: 1.45; margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .r-pay { font-family: var(--serif); font-size: clamp(22px, 2vw, 30px); white-space: nowrap; text-align: right; }
  .r-tags { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  .arrow { position: absolute; right: 18px; bottom: 12px; color: var(--c); opacity: 0; transform: translateX(-6px); transition: .3s; }
  .row:hover .arrow { opacity: 1; transform: translateX(0); }

  .empty-line { padding: 16px 22px; border: 1px dashed var(--line); border-radius: 16px; color: var(--muted); font-size: 14px; }

  @media (max-width: 1100px) {
    .band { grid-template-columns: 1fr; }
    .pipe { grid-template-columns: repeat(6, auto); justify-content: space-between; }
    .focus { grid-template-columns: 1fr; }
    .queue { grid-auto-rows: auto; }
  }
  @media (max-width: 640px) {
    .pipe { grid-template-columns: repeat(3, auto); }
    .row { grid-template-columns: minmax(0, 1fr) auto; }
    .rank { display: none; }
    .r-mid { grid-column: 1 / -1; }
    .r-note { -webkit-line-clamp: 3; }
    .r-pay { text-align: left; white-space: normal; font-size: 24px; }
    .r-tags { flex-direction: row; align-items: center; }
    .fact { padding: 12px; } .fact .fv { font-size: 22px; }
    .brand span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<div class="glow"></div>
<div class="shell">
  <div class="bar">
    <div class="brand">Job Search <em>Tracker</em><span id="sub">Remote, $70K and up</span></div>
    <div class="month-nav">
      <button id="prev" aria-label="Previous month">&#8249;</button>
      <div class="month-label" id="monthLabel"></div>
      <button id="next" aria-label="Next month">&#8250;</button>
    </div>
  </div>

  <section class="band">
    <div>
      <div class="count"><span class="big" id="appliedNum">0</span><span class="of">/ <span id="goalNum">10</span></span></div>
      <div class="count-label" id="countLabel">Applications this month</div>
      <div class="pace good" id="pace">On pace</div>
    </div>
    <div class="segwrap">
      <div class="segs" id="segs"></div>
      <div class="segmeta"><span id="segLeft"></span><span id="segRight"></span></div>
    </div>
    <div class="pipe" id="pipe"></div>
  </section>

  <main class="stage" id="stage"></main>
</div>

<script>
(function () {
  var STATUS = {
    Found: "var(--c-found)", Drafting: "var(--c-drafting)", Applied: "var(--c-applied)",
    Interview: "var(--c-interview)", Offer: "var(--c-offer)", Rejected: "var(--c-closed)", Passed: "var(--c-closed)"
  };
  var FIT = { High: 3, Medium: 2, Low: 1 };
  var data = { goal: { monthlyApplications: 10 }, jobs: [] };
  var today = new Date();
  var view = new Date(today.getFullYear(), today.getMonth(), 1);
  var shown = 0;

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
  function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : null; }
  function monthKey(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0"); }
  function parse(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function fmt(s) { return s ? parse(s).toLocaleDateString(undefined, { month: "short", day: "numeric" }) : ""; }
  function isApplied(j) { return ["Applied", "Interview", "Offer", "Rejected"].indexOf(j.status) !== -1 && !!j.dateApplied; }
  function age(s) {
    if (!s) return "";
    var d = Math.round((new Date(today.getFullYear(), today.getMonth(), today.getDate()) - parse(s)) / 86400000);
    return d <= 0 ? "Found today" : d === 1 ? "Found yesterday" : "Found " + d + " days ago";
  }
  function countTo(node, from, to) {
    var start = null;
    function step(t) {
      if (start === null) start = t;
      var k = Math.min(1, (t - start) / 900), e = 1 - Math.pow(1 - k, 3);
      node.textContent = Math.round(from + (to - from) * e);
      if (k < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function payNum(j) { return j.payMin || 0; }

  function renderBand() {
    var goal = data.goal.monthlyApplications || 10;
    var applied = data.jobs.filter(function (j) { return isApplied(j) && j.dateApplied.slice(0, 7) === monthKey(view); }).length;
    var monthName = view.toLocaleDateString(undefined, { month: "long" });
    document.getElementById("monthLabel").textContent = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
    document.getElementById("countLabel").textContent = "Applications in " + monthName;
    document.getElementById("goalNum").textContent = goal;
    countTo(document.getElementById("appliedNum"), shown, applied);
    shown = applied;

    var segs = document.getElementById("segs");
    var n = Math.min(goal, 30);
    segs.style.gridTemplateColumns = "repeat(" + n + ", 1fr)";
    segs.textContent = "";
    for (var i = 0; i < n; i++) {
      var s = el("div", "seg" + (i < applied ? " on" : ""));
      s.style.setProperty("--d", (0.2 + i * 0.07) + "s");
      segs.appendChild(s);
    }
    var left = Math.max(0, goal - applied);
    document.getElementById("segLeft").textContent = left === 0 ? "Goal reached" : left + " to go";
    document.getElementById("segRight").textContent = Math.round(Math.min(100, applied / goal * 100)) + "% of monthly goal";

    var pace = document.getElementById("pace");
    pace.className = "pace";
    var isCurrent = monthKey(view) === monthKey(today);
    var isPast = view < new Date(today.getFullYear(), today.getMonth(), 1);
    if (applied >= goal) { pace.classList.add("good"); pace.textContent = "Goal reached"; }
    else if (isPast) { pace.classList.add("bad"); pace.textContent = left + " short of goal"; }
    else if (!isCurrent) { pace.classList.add("warn"); pace.textContent = "Upcoming month"; }
    else {
      var dim = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      var expected = goal * today.getDate() / dim;
      if (applied >= expected) { pace.classList.add("good"); pace.textContent = "On pace"; }
      else if (applied >= expected - 2) { pace.classList.add("warn"); pace.textContent = "Slightly behind pace"; }
      else { pace.classList.add("bad"); pace.textContent = "Behind pace"; }
    }
  }

  function renderPipe() {
    var c = { Found: 0, Drafting: 0, Applied: 0, Interview: 0, Offer: 0, Closed: 0 };
    data.jobs.forEach(function (j) { var k = (j.status === "Rejected" || j.status === "Passed") ? "Closed" : j.status; if (c[k] !== undefined) c[k]++; });
    var pipe = document.getElementById("pipe");
    pipe.textContent = "";
    Object.keys(c).forEach(function (k) {
      var d = el("div", "pstat");
      d.style.setProperty("--c", STATUS[k === "Closed" ? "Rejected" : k]);
      d.appendChild(el("div", "n", String(c[k])));
      d.appendChild(el("div", "l", k));
      pipe.appendChild(d);
    });
  }

  function tagsFor(j, withFit) {
    var t = el("div", "tags");
    var st = el("span", "tag st", j.status); st.style.setProperty("--c", STATUS[j.status] || "var(--c-found)"); t.appendChild(st);
    if (withFit && j.fit) t.appendChild(el("span", "tag fit-" + j.fit, j.fit + " fit"));
    return t;
  }
  function wrapLink(j, cls) {
    var url = safeUrl(j.link);
    var n = url ? el("a", cls) : el("div", cls);
    if (url) { n.href = url; n.target = "_blank"; n.rel = "noopener noreferrer"; }
    return n;
  }
  function row(j, idx, rank, delay) {
    var r = wrapLink(j, "row");
    r.style.setProperty("--c", STATUS[j.status] || "var(--c-found)");
    r.style.animationDelay = delay + "s";
    if (rank) r.appendChild(el("div", "rank", String(idx + 2)));
    var mid = el("div", "r-mid");
    mid.appendChild(el("div", "r-role", j.role));
    mid.appendChild(el("div", "r-company", j.company + (j.dateApplied ? " · Applied " + fmt(j.dateApplied) : j.dateFound ? " · " + age(j.dateFound) : "")));
    if (j.notes) mid.appendChild(el("div", "r-note", j.notes));
    r.appendChild(mid);
    if (j.pay) r.appendChild(el("div", "r-pay", j.pay));
    var tg = tagsFor(j, true); tg.className = "tags r-tags"; r.appendChild(tg);
    return r;
  }
  function section(label, count) {
    var h = el("div", "sec-head");
    var b = el("b", "", label); h.appendChild(b); h.appendChild(document.createTextNode(String(count)));
    return h;
  }

  function renderStage() {
    var stage = document.getElementById("stage");
    stage.textContent = "";
    if (!data.jobs.length) { stage.appendChild(el("div", "empty-line", "No jobs tracked yet.")); return; }

    var RANK = { Offer: 0, Interview: 1, Found: 2, Drafting: 2, Applied: 3, Rejected: 4, Passed: 4 };
    var EYEBROW = { Offer: "Offer on the table", Interview: "Interview in progress", Found: "Apply next", Drafting: "Finish and apply", Applied: "Waiting to hear back", Rejected: "Closed", Passed: "Closed" };
    var jobs = data.jobs.slice().sort(function (a, b) {
      return (RANK[a.status] - RANK[b.status]) ||
        (FIT[b.fit] || 0) - (FIT[a.fit] || 0) ||
        payNum(b) - payNum(a) ||
        (b.dateApplied || "").localeCompare(a.dateApplied || "");
    });

    var wrap = el("div");
    wrap.style.cssText = "display:flex;flex-direction:column;flex:1 1 auto;";
    wrap.appendChild(section("Pipeline, ranked by priority", jobs.length));
    var rest = jobs.slice(1);
    var focus = el("div", "focus" + (rest.length === 0 ? " solo" : "") + (rest.length > 7 ? " tall" : ""));

    var top = jobs[0];
    var f = wrapLink(top, "feature");
    f.appendChild(el("div", "eyebrow", EYEBROW[top.status] || "Top priority"));
    f.appendChild(el("div", "f-role", top.role));
    f.appendChild(el("div", "f-company", top.company));
    if (top.pay) f.appendChild(el("div", "f-pay", top.pay));
    if (top.notes) f.appendChild(el("div", "f-note", top.notes));

    var facts = el("div", "facts");
    function fact(label, value, cls) {
      var d = el("div", "fact");
      d.appendChild(el("div", "fl", label));
      d.appendChild(el("div", "fv" + (cls ? " " + cls : ""), value));
      facts.appendChild(d);
    }
    if (top.fit) fact("Fit", top.fit, top.fit);
    if (top.payMin && data.minPay) {
      var delta = top.payMin - data.minPay;
      fact("Vs. $" + Math.round(data.minPay / 1000) + "K floor", delta > 0 ? "+$" + delta.toLocaleString() : "At floor", delta > 0 ? "up" : "");
    }
    fact(top.dateApplied ? "Applied" : "Found", top.dateApplied ? fmt(top.dateApplied) : (age(top.dateFound).replace("Found ", "") || "—"));
    f.appendChild(facts);

    var foot = el("div", "f-foot");
    foot.appendChild(tagsFor(top, false));
    foot.appendChild(el("span", "cta", (top.status === "Found" || top.status === "Drafting" ? "Open application" : "Open posting") + " →"));
    f.appendChild(foot);
    focus.appendChild(f);

    if (rest.length) {
      var q = el("div", "queue");
      rest.forEach(function (j, i) {
        var r = row(j, i, true, 0.25 + i * 0.07);
        if (RANK[j.status] === 4) r.classList.add("dim");
        q.appendChild(r);
      });
      focus.appendChild(q);
    }
    wrap.appendChild(focus);
    stage.appendChild(wrap);
  }

  function shift(d) { view = new Date(view.getFullYear(), view.getMonth() + d, 1); renderBand(); }
  document.getElementById("prev").onclick = function () { shift(-1); };
  document.getElementById("next").onclick = function () { shift(1); };

  fetch("data/jobs.json", { cache: "no-store" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      data = d;
      if (d.minPay) document.getElementById("sub").textContent = "Remote, $" + Math.round(d.minPay / 1000) + "K and up";
      renderBand(); renderPipe(); renderStage();
    })
    .catch(function () {
      document.getElementById("stage").appendChild(el("div", "empty-line", "Could not load the job data."));
    });
})();
</script>
</body>
</html>
